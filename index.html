<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centred column, one task per screen, big tap targets stacked top to bottom.
   Deliberately a single warm light look (cream paper, deep ink) for maximum legibility. */
:root {
  --bg: #FBF5E9;          /* cream paper */
  --surface: #FFFDF7;     /* card */
  --ink: #2A231E;         /* main text, deep warm brown */
  --muted: #51463C;       /* secondary text, still high contrast */
  --line: #E2D5BF;        /* soft borders */
  --sage: #2E5B4E;        /* primary buttons */
  --sage-press: #234A3F;
  --sage-soft: #DDE9E2;
  --rose-soft: #F5E0D6;
  --rose-ink: #7A3524;
  --honey-soft: #F6E7BE;
  --honey-ink: #6B4E0C;
  --on-sage: #FFFFFF;
  --focus: #1F5FA8;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", Verdana, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 26px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 28px;
  animation: rise .45s ease-out both;
}
@keyframes rise { from { opacity: .35; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) {
  .screen, .breathe { animation: none !important; }
}

h1, h2 {
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: clamp(42px, 10vw, 60px); }
h2 { font-size: clamp(34px, 8vw, 48px); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 24px; }
.center { text-align: center; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 24px; color: var(--muted);
}
.label {
  font-size: 24px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
}

/* Buttons */
button { font: inherit; color: inherit; }
.btn {
  appearance: none;
  border: 3px solid transparent;
  border-radius: 22px;
  min-height: 92px;
  padding: 18px 26px;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  cursor: pointer;
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  text-align: center;
  transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
}
.btn:active { transform: scale(.98); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, .seg button:focus-visible {
  outline: 4px solid var(--focus); outline-offset: 3px;
}
.btn-primary { background: var(--sage); color: var(--on-sage); box-shadow: 0 6px 0 var(--sage-press); }
.btn-primary:active { box-shadow: 0 2px 0 var(--sage-press); transform: translateY(4px); }
.btn-primary[disabled] { background: #A9B8B1; box-shadow: none; cursor: not-allowed; color: #FFFFFF; }
.btn-soft { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-soft:active { background: var(--sage-soft); }
.btn-text {
  background: none; border: none; color: var(--muted); text-decoration: underline;
  font-size: 24px; min-height: 64px; padding: 8px 12px; cursor: pointer;
}
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.row > * { flex: 1 1 200px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.push { margin-top: auto; }

/* Cards */
.card {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 26px;
  padding: 26px;
  display: flex; flex-direction: column; gap: 14px;
  min-width: 0;
}
.card.sage { background: var(--sage-soft); border-color: #C3D8CC; }
.card.rose { background: var(--rose-soft); border-color: #EBC9B9; }
.card.honey { background: var(--honey-soft); border-color: #E8D296; }

/* Setup */
.brand { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.brand .mark {
  width: 84px; height: 84px; border-radius: 50%;
  background: var(--honey-soft); color: var(--honey-ink);
  font-family: var(--font-display); font-size: 58px; line-height: 84px; text-align: center;
}
.seg { display: flex; gap: 0; border: 3px solid var(--sage); border-radius: 22px; overflow: hidden; }
.seg button {
  flex: 1; min-height: 76px; border: none; background: var(--surface); color: var(--sage);
  font-size: 26px; font-weight: 700; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--sage); color: var(--on-sage); }

.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.players li {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 8px 8px 8px 22px; min-height: 76px;
}
.players .pname { flex: 1; min-width: 0; font-size: 28px; font-weight: 700; overflow-wrap: anywhere; }
.chip {
  appearance: none; border: 2px solid var(--line); background: var(--bg);
  border-radius: 14px; min-width: 64px; min-height: 60px; padding: 6px 16px;
  font-size: 24px; font-weight: 700; color: var(--rose-ink); cursor: pointer;
}
.addrow { display: flex; gap: 12px; flex-wrap: wrap; }
.addrow input {
  flex: 1 1 220px; min-width: 0;
  font: inherit; font-size: 28px; color: var(--ink);
  background: #FFFFFF; border: 3px solid #BFAE93; border-radius: 18px;
  min-height: 80px; padding: 10px 20px;
}
.addrow input::placeholder { color: #75695C; }
.addrow .btn { width: auto; flex: 0 0 auto; min-height: 80px; }
.stepper { display: flex; align-items: center; gap: 16px; }
.stepper .btn { width: 92px; flex: 0 0 auto; font-size: 40px; padding: 0; }
.stepper .val {
  flex: 1; text-align: center; font-family: var(--font-display); font-size: 52px;
  font-variant-numeric: tabular-nums;
}
details.rules { font-size: 24px; padding-block: 14px; gap: 0; }
details.rules summary { cursor: pointer; font-weight: 700; min-height: 56px; display: flex; align-items: center; }
details.rules ol { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }

/* Pass / question */
.pass-hero { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; padding-top: 6vh; }
.pass-hero .who {
  font-family: var(--font-display); font-size: clamp(48px, 13vw, 76px); line-height: 1.1;
  color: var(--sage); overflow-wrap: anywhere;
}
.phone-icon { width: 96px; height: 96px; }
.breathe { animation: breathe 3.5s ease-in-out infinite; }
.question {
  font-family: var(--font-display);
  font-size: clamp(34px, 8vw, 50px);
  line-height: 1.25;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.progress { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.progress span { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
.progress span.done { background: var(--sage); }
.progress span.now { background: var(--honey-ink); }

.countdown { display: flex; justify-content: center; gap: 18px; }
.countdown span {
  width: 96px; height: 96px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 52px;
  background: var(--honey-soft); color: var(--honey-ink);
}
.countdown span:last-child { background: var(--sage); color: var(--on-sage); }

/* Vote */
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.vote-grid .btn { font-size: 32px; min-height: 100px; overflow-wrap: anywhere; }

/* Scores */
.scores { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.scores li {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 14px 20px; min-height: 80px;
}
.scores li.lead { border-color: var(--honey-ink); background: var(--honey-soft); }
.scores .sname { font-size: 28px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.scores .gain {
  font-size: 24px; font-weight: 700; color: var(--sage);
  background: var(--sage-soft); border-radius: 12px; padding: 2px 12px;
}
.scores .gain.none { visibility: hidden; }
.scores .pts { font-family: var(--font-display); font-size: 40px; font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; }
.bar { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.bar i { display: block; height: 100%; background: var(--sage); border-radius: 7px; transition: width .8s ease; }

.verdict { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.verdict .badge {
  width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center;
}
.verdict .badge svg { width: 64px; height: 64px; }
.verdict.win .badge { background: var(--sage-soft); color: var(--sage); }
.verdict.lose .badge { background: var(--rose-soft); color: var(--rose-ink); }
.oddname { font-family: var(--font-display); font-size: clamp(40px, 10vw, 58px); color: var(--sage); overflow-wrap: anywhere; }
.qtext { font-family: var(--font-display); font-size: clamp(28px, 6.5vw, 38px); line-height: 1.3; }
.points-line { font-size: 26px; font-weight: 700; }
</style>
</head>

/* ---------- State & storage ---------- */
var KEY = 'oddQuestion.v1';
var MIN_P = 3, MAX_P = 10;

function loadStore() {
  try { var v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v === 'object' ? v : {}; }
  catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

var stored = (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.S) || loadStore();
var S = {
  lang: stored.lang === 'fr' ? 'fr' : 'en',
  players: Array.isArray(stored.players) ? stored.players.filter(function (p) { return typeof p === 'string' && p.trim(); }).slice(0, MAX_P) : [],
  target: Number.isInteger(stored.target) && stored.target >= 3 && stored.target <= 50 ? stored.target : 10,
  deck: stored.deck && Array.isArray(stored.deck.order) ? stored.deck : null,
  game: stored.game && typeof stored.game === 'object' && stored.game.scores ? stored.game : null
};
// Never land on a visible question after a reload: go back to "pass the phone".
if (S.game && S.game.phase === 'show') S.game.phase = 'pass';

var ui = { menu: false, confirmEnd: false, error: '' };

if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(function () { return { S: S }; }); } catch (e) {}
}

/* ---------- Helpers ---------- */
function t(key, vars) {
  var s = T[S.lang][key];
  if (typeof s !== 'string') return s;
  return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && vars[k] != null ? vars[k] : ''; });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}
function nextPairId() {
  var d = S.deck;
  if (!d || d.order.length !== PAIRS.length || d.pos >= d.order.length) {
    var last = d && d.order ? d.order[d.order.length - 1] : -1;
    var order = shuffle(PAIRS.map(function (_, i) { return i; }));
    if (order[0] === last && order.length > 1) { order[0] = order[order.length - 1]; order[order.length - 1] = last; }
    d = S.deck = { order: order, pos: 0 };
  }
  return d.order[d.pos++];
}
function joinNames(list) {
  var e = list.map(esc);
  if (e.length < 2) return e.join('');
  return e.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + e[e.length - 1];
}

/* ---------- Game flow ---------- */
function startGame() {
  var scores = {};
  S.players.forEach(function (p) { scores[p] = 0; });
  S.game = { scores: scores, round: 0, players: S.players.slice() };
  newRound();
}
function newRound() {
  var g = S.game, ps = g.players, n = ps.length;
  g.round += 1;
  var shift = (g.round - 1) % n;
  g.order = ps.slice(shift).concat(ps.slice(0, shift));
  g.odd = ps[Math.floor(Math.random() * n)];
  g.pairId = nextPairId();
  g.passIdx = 0;
  g.accused = null;
  g.guessed = null;
  g.revealStep = null;
  g.gains = {};
  g.phase = 'pass';
  commit();
}
function award(name, pts) {
  S.game.scores[name] = (S.game.scores[name] || 0) + pts;
  S.game.gains[name] = (S.game.gains[name] || 0) + pts;
}
function reveal() {
  var g = S.game;
  g.phase = 'reveal';
  if (g.accused === g.odd) {
    g.players.forEach(function (p) { if (p !== g.odd) award(p, 1); });
    g.revealStep = 'guessing';
  } else {
    award(g.odd, 3);
    g.revealStep = 'done';
  }
  commit();
}
function answerGuess(yes) {
  var g = S.game;
  if (g.revealStep !== 'questions') return;
  g.guessed = yes;
  if (yes) award(g.odd, 2);
  g.revealStep = 'done';
  commit();
}
function toScores() {
  var g = S.game, max = 0;
  g.players.forEach(function (p) { max = Math.max(max, g.scores[p]); });
  g.phase = max >= S.target ? 'winner' : 'scores';
  commit();
}

function commit() { save(); render(); }

/* ---------- Render ---------- */
var app = document.getElementById('app');
var lastKey = '';

function render() {
  document.documentElement.lang = S.lang;
  var g = S.game, html, key;
  if (!g || g.phase === 'setup') { html = viewSetup(); key = 'setup'; }
  else if (ui.menu) { html = viewMenu(); key = 'menu' + ui.confirmEnd; }
  else {
    key = g.phase + g.round + ':' + g.passIdx + ':' + g.revealStep;
    html = ({
      pass: viewPass, show: viewShow, answer: viewAnswer, vote: viewVote, confirm: viewConfirm,
      reveal: viewReveal, scores: viewScores, winner: viewWinner
    }[g.phase] || viewPass)(g);
  }
  var animate = key !== lastKey;
  lastKey = key;
  app.innerHTML = '<div class="screen' + (animate ? '' : ' still') + '">' + html + '</div>';
  if (!animate) app.firstChild.style.animation = 'none';
  if (animate) window.scrollTo(0, 0);
}

/* ---------- Events ---------- */
app.addEventListener('submit', function (e) {
  e.preventDefault();
  var input = document.getElementById('name-input');
  var name = (input.value || '').replace(/\s+/g, ' ').trim();
  if (!name) { input.focus(); return; }
  var exists = S.players.some(function (p) { return p.toLowerCase() === name.toLowerCase(); });
  if (exists) { ui.error = t('dup', { name: name }); }
  else if (S.players.length >= MAX_P) { ui.error = t('full'); }
  else { S.players.push(name); ui.error = ''; save(); }
  render();
  var again = document.getElementById('name-input');
  if (again) again.focus();
});

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var g = S.game, act = b.getAttribute('data-act');
  switch (act) {
    case 'lang': S.lang = b.getAttribute('data-v'); ui.error = ''; commit(); break;
    case 'remove': S.players.splice(+b.getAttribute('data-i'), 1); ui.error = ''; commit(); break;
    case 'target':
      S.target = Math.max(3, Math.min(50, S.target + +b.getAttribute('data-d'))); commit(); break;
    case 'start': if (S.players.length >= MIN_P) { ui.error = ''; keepAwake(); startGame(); } break;
    case 'continue': g.phase = g.phase === 'setup' ? 'scores' : g.phase; keepAwake(); commit(); break;
    case 'menu': ui.menu = true; ui.confirmEnd = false; render(); break;
    case 'closemenu': ui.menu = false; render(); break;
    case 'endgame': ui.confirmEnd = true; render(); break;
    case 'endno': ui.confirmEnd = false; ui.menu = false; render(); break;
    case 'endyes': ui.menu = false; ui.confirmEnd = false; S.game = null; commit(); break;
    case 'show': g.phase = 'show'; commit(); break;
    case 'hide':
      g.passIdx += 1;
      g.phase = g.passIdx >= g.order.length ? 'answer' : 'pass';
      commit(); break;
    case 'tovote': g.phase = 'vote'; commit(); break;
    case 'accuse': g.accused = g.players[+b.getAttribute('data-i')]; g.phase = 'confirm'; commit(); break;
    case 'revote': g.accused = null; g.phase = 'vote'; commit(); break;
    case 'reveal': if (g.phase === 'confirm') reveal(); break;
    case 'showqs': if (g.revealStep === 'guessing') { g.revealStep = 'questions'; commit(); } break;
    case 'guess': answerGuess(b.getAttribute('data-v') === '1'); break;
    case 'toscores': if (g.revealStep === 'done') toScores(); break;
    case 'next': newRound(); break;
    case 'again': S.players = g.players.slice(); startGame(); break;
    case 'change': S.game = null; commit(); break;
  }
});

/* Keep the screen on while playing, if the device allows it. */
var wakeLock = null;
function keepAwake() {
  try {
    if (navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l; l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.game) keepAwake();
});

render();
})();
</script>
