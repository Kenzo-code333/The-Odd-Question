<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Odd Question</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A0E15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: a game-show console. One centred column on a dark grid, a mono "phase" eyebrow,
   one big headline, and the main action pinned to the bottom of every screen.
   Deliberately a single dark look; all text stays at 24px or larger for older players. */
:root {
  --bg: #0A0E15;            /* console night */
  --grid: rgba(120, 170, 220, .07);
  --panel: #141B26;
  --panel-2: #1B2433;
  --line: #2A3547;
  --text: #F3F6FA;
  --muted: #AEB9C9;         /* secondary text, ~9:1 on --bg */
  --teal: #1FE3D0;          /* group / go */
  --teal-deep: #0DB3A6;
  --teal-ink: #04211F;      /* text on teal */
  --teal-dim: rgba(31, 227, 208, .14);
  --amber: #F4B63F;         /* rounds, leaders */
  --amber-dim: rgba(244, 182, 63, .14);
  --red: #FF4B4B;           /* the Odd One */
  --orange: #FF7B45;
  --red-dim: rgba(255, 75, 75, .14);
  --font-display: "Lexend", "Segoe UI", Verdana, Arial, sans-serif;
  --font-body: "Lexend", "Segoe UI", Verdana, Arial, sans-serif;
  --font-mono: "Space Mono", "Courier New", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(31, 227, 208, .08), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 44px 44px, 44px 44px;
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
.screen { flex: 1; display: flex; flex-direction: column; gap: 20px; animation: rise .4s ease-out both; }
@keyframes rise { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(31,227,208,.0), 0 0 24px rgba(31,227,208,.25); } 50% { box-shadow: 0 0 0 14px rgba(31,227,208,.06), 0 0 40px rgba(31,227,208,.45); } }
@keyframes alarm { 0%,100% { box-shadow: 0 0 0 0 rgba(255,75,75,0); } 50% { box-shadow: 0 0 30px 6px rgba(255,75,75,.5); } }
@media (prefers-reduced-motion: reduce) { .screen, .glow, .role.odd { animation: none !important; } }

h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(32px, 7.9vw, 46px); }
h2 { font-size: clamp(27px, 6.8vw, 39px); }
h2 em { font-style: normal; color: var(--teal); text-shadow: 0 0 22px rgba(31,227,208,.45); }
p { margin: 0; }
b { color: var(--text); }
.muted { color: var(--muted); }
.center { text-align: center; }

/* Mono labels and eyebrows */
.label, .eyebrow {
  font-family: var(--font-mono); font-weight: 700; font-size: 17px;
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.eyebrow { display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--amber); text-align: center; }
.eyebrow::before, .eyebrow::after { content: ""; height: 2px; width: 24px; background: currentColor; opacity: .5; border-radius: 1px; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.badge-round {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--amber); background: var(--amber-dim); border: 2px solid rgba(244,182,63,.45);
  border-radius: 12px; padding: 4px 10px;
}
.badge-round::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.icon-btn {
  appearance: none; width: 49px; height: 49px; border-radius: 18px; cursor: pointer;
  background: var(--panel-2); border: 2px solid var(--line); color: var(--text);
  display: grid; place-items: center;
}
.icon-btn svg { width: 23px; height: 23px; }

/* Buttons */
button { font: inherit; color: inherit; }
.btn {
  appearance: none; border: 2px solid transparent; border-radius: 20px;
  min-height: 63px; padding: 12px 16px; width: 100%;
  font-family: var(--font-display); font-size: 17px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; line-height: 1.2;
  display: flex; align-items: center; justify-content: center; gap: 14px; text-align: center;
  cursor: pointer; touch-action: manipulation;
  transition: transform .12s ease, box-shadow .2s ease, background-color .2s ease;
}
.btn svg { width: 19px; height: 19px; flex: none; }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, input:focus-visible, .seg button:focus-visible, .vote:focus-visible, summary:focus-visible {
  outline: 4px solid var(--amber); outline-offset: 3px;
}
.btn-go { background: linear-gradient(90deg, var(--teal-deep), var(--teal)); color: var(--teal-ink); box-shadow: 0 8px 30px rgba(31,227,208,.35); }
.btn-danger { background: linear-gradient(90deg, #D9223F, var(--orange)); color: #FFFFFF; box-shadow: 0 8px 30px rgba(255,90,70,.3); }
.btn-ghost { background: rgba(20,27,38,.7); border-color: rgba(31,227,208,.5); color: var(--teal); }
.btn[disabled] { background: var(--panel-2); color: var(--muted); box-shadow: none; border-color: var(--line); cursor: not-allowed; }
.btn-text { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 17px; min-height: 46px; padding: 6px 9px; cursor: pointer; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row > * { flex: 1 1 220px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.dock { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 14px; }

/* Panels */
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 2px solid var(--line); border-radius: 22px; padding: 22px;
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
}

/* Setup */
.brand { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding-top: 6px; }
.logo {
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
  border: 3px solid var(--teal); color: var(--teal); background: var(--teal-dim);
  font-family: var(--font-display); font-weight: 800; font-size: 37px;
  text-shadow: 0 0 16px rgba(31,227,208,.6);
}
.seg { display: flex; border: 2px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--panel); }
.seg button { flex: 1; min-height: 55px; border: none; background: transparent; color: var(--muted); font-size: 19px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.players li {
  display: flex; align-items: center; gap: 14px; min-height: 55px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 18px;
}
.players .num { font-family: var(--font-mono); font-size: 17px; color: var(--teal); min-width: 1.6em; }
.players .pname { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.chip {
  appearance: none; min-width: 46px; min-height: 43px; border-radius: 14px; cursor: pointer;
  background: var(--red-dim); border: 2px solid rgba(255,75,75,.4); color: var(--red);
  display: grid; place-items: center;
}
.chip svg { width: 19px; height: 19px; }
.addrow { display: flex; gap: 12px; flex-wrap: wrap; }
.addrow input {
  flex: 1 1 220px; min-width: 0; min-height: 58px; padding: 7px 14px;
  font: inherit; font-size: 20px; color: var(--text);
  background: #0E141E; border: 2px solid #3A4860; border-radius: 18px;
}
.addrow input::placeholder { color: #8D99AB; }
.addrow .btn { width: auto; flex: 0 0 auto; min-height: 58px; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper .btn { width: 63px; flex: 0 0 auto; padding: 0; font-size: 29px; letter-spacing: 0; }
.stepper .val { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 37px; color: var(--amber); font-variant-numeric: tabular-nums; }
details.rules summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
details.rules ol { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; font-size: 17px; color: var(--muted); }
.error { color: var(--red); font-weight: 700; font-size: 17px; }

/* Pass */
.pass { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 3vh; }
.rings { width: 107px; height: 107px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(31,227,208,.2); margin-bottom: 10px; }
.rings > div {
  width: 75px; height: 75px; border-radius: 50%; display: grid; place-items: center;
  background: var(--teal-dim); border: 2px solid rgba(31,227,208,.55); color: var(--teal);
}
.glow { animation: glow 3s ease-in-out infinite; }
.rings svg { width: 33px; height: 33px; }
.who { font-family: var(--font-display); font-weight: 800; font-size: clamp(39px, 10.8vw, 60px); line-height: 1.05; overflow-wrap: anywhere; text-shadow: 0 0 30px rgba(255,255,255,.18); }
.divider { width: 46px; height: 3px; border-radius: 2px; background: var(--teal); opacity: .5; margin: 6px auto; }
.turns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; }
.turn { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 46px; font-family: var(--font-mono); font-size: 17px; color: var(--muted); }
.turn i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: block; }
.turn.done i { background: var(--teal-deep); opacity: .6; }
.turn.now { color: var(--teal); }
.turn.now i { background: var(--teal); box-shadow: 0 0 0 5px var(--teal-dim), 0 0 14px var(--teal); }

/* Question */
.role { border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.role.same { background: var(--teal-dim); border: 2px solid rgba(31,227,208,.5); color: var(--teal); font-weight: 700; }
.role.odd { background: #160B0D; border: 3px solid var(--red); animation: alarm 2.2s ease-in-out infinite; }
.role.odd svg { width: 46px; height: 46px; margin: 0 auto; }
.role.odd .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6.8vw, 37px); line-height: 1.1; color: var(--red); text-transform: uppercase; text-shadow: 0 0 18px rgba(255,75,75,.55); }
.role.odd p { font-weight: 700; }
.question { font-family: var(--font-display); font-weight: 700; font-size: clamp(23px, 5.8vw, 33px); line-height: 1.25; text-wrap: balance; overflow-wrap: break-word; }
.hint { color: var(--amber); font-weight: 700; }

/* Answer countdown */
.count { display: flex; align-items: center; justify-content: center; gap: 10px; }
.count .n {
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--font-display); font-weight: 700; font-size: 32px;
  color: rgba(31,227,208,.55); background: rgba(31,227,208,.06); border: 2px solid rgba(31,227,208,.25);
}
.count .n.go { width: 81px; height: 81px; font-size: 40px; color: var(--text); background: rgba(31,227,208,.12); border: 3px solid var(--teal); }
.count .dash { width: 16px; height: 3px; background: rgba(31,227,208,.35); border-radius: 2px; }

/* Vote */
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.vote {
  appearance: none; cursor: pointer; min-height: 86px; border-radius: 20px; padding: 10px 7px;
  background: var(--panel); border: 2px solid var(--line); color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 20px; font-weight: 700; overflow-wrap: anywhere; text-align: center;
}
.vote .av {
  width: 37px; height: 37px; border-radius: 50%; display: grid; place-items: center;
  background: var(--teal-dim); color: var(--teal); font-family: var(--font-mono); font-size: 17px;
}
.vote:active { border-color: var(--red); background: var(--red-dim); }
.target-ring {
  width: 144px; max-width: 100%; aspect-ratio: 1; border-radius: 50%; margin: 0 auto;
  display: grid; place-items: center; padding: 16px; text-align: center;
  border: 3px solid var(--red); background: var(--red-dim); box-shadow: 0 0 40px rgba(255,75,75,.3);
  font-family: var(--font-display); font-weight: 800; font-size: clamp(23px, 6.5vw, 32px); overflow-wrap: anywhere; line-height: 1.1;
}

/* Reveal */
.hero {
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  margin-top: -20px;
  padding: 34px max(16px, env(safe-area-inset-right, 0px)) 26px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
}
.hero.escaped { background: linear-gradient(120deg, #C8283A, var(--orange)); }
.hero.caught { background: linear-gradient(120deg, #0B8F86, var(--teal)); color: var(--teal-ink); }
.hero.win { background: linear-gradient(120deg, #B8801A, var(--amber)); color: #1E1405; }
.hero svg { width: 40px; height: 40px; }
.hero h1, .hero h2 { text-transform: uppercase; }
.hero p { font-size: 17px; opacity: .92; }
@media (min-width: 513px) { .hero { margin-left: 0; margin-right: 0; border-radius: 0 0 28px 28px; } }
.strip {
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 10px 13px; color: var(--muted); text-align: center;
}
.strip svg { width: 20px; height: 20px; flex: none; }
.qcards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 432px) { .qcards { grid-template-columns: 1fr 1fr; } }
.qcard {
  background: var(--panel); border: 2px solid var(--line); border-top: 5px solid var(--teal);
  border-radius: 20px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.qcard.odd { border-top-color: var(--red); }
.qcard .label { color: var(--teal); display: flex; align-items: center; gap: 10px; }
.qcard.odd .label { color: var(--red); }
.qcard .qi { width: 35px; height: 35px; border-radius: 12px; display: grid; place-items: center; background: var(--teal-dim); color: var(--teal); }
.qcard.odd .qi { background: var(--red-dim); color: var(--red); }
.qcard .qi svg { width: 20px; height: 20px; }
.qcard .qtext { font-weight: 700; font-size: 20px; line-height: 1.3; }
.qcard .who-list { font-size: 17px; color: var(--muted); }
.qcard.odd .who-list { color: #FF8A8A; }
.callout { background: var(--amber-dim); border: 2px solid rgba(244,182,63,.45); border-radius: 20px; padding: 20px; font-weight: 700; }
.points { display: flex; flex-direction: column; gap: 8px; }
.points p { display: flex; gap: 12px; align-items: baseline; }
.points .plus { font-family: var(--font-mono); color: var(--amber); }

/* Scores */
.scores { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.scores li {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px 14px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 10px 13px;
}
.scores li.lead { border-color: var(--amber); background: linear-gradient(90deg, var(--amber-dim), var(--panel)); }
.scores .rank { font-family: var(--font-mono); font-size: 17px; color: var(--muted); min-width: 1.4em; }
.scores li.lead .rank { color: var(--amber); }
.scores .sname { font-size: 20px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.scores .gain { font-family: var(--font-mono); font-size: 17px; color: var(--teal); background: var(--teal-dim); border-radius: 10px; padding: 1px 7px; }
.scores .gain.none { visibility: hidden; }
.scores .pts { font-family: var(--font-mono); font-size: 27px; text-align: right; min-width: 1.6em; font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: #222C3B; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--teal-deep), var(--teal)); transition: width .8s ease; }
.scores li.lead .bar i { background: var(--amber); }
/* Compact pass: every screen fits one phone screen without scrolling (up to 10 players). */
#app { padding-block: 12px 14px; }
.screen { gap: 14px; }
.stack { gap: 8px; }
.dock { padding-top: 4px; gap: 10px; }
.btn { min-height: 54px; padding: 10px 14px; }
.label, .eyebrow, .badge-round { font-size: 14px; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; }
.icon-btn svg { width: 24px; height: 24px; }
.panel { padding: 12px 14px; gap: 8px; border-radius: 16px; }
.brand { flex-direction: row; align-items: center; gap: 12px; padding-top: 0; }
.brand .logo { width: 48px; height: 48px; font-size: 27px; flex: none; }
.brand h1 { font-size: 28px; }
.brand p { font-size: 15px; line-height: 1.3; }
.setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.setup-row > * { min-width: 0; }
.seg button { min-height: 46px; font-size: 15px; }
.stepper { gap: 6px; }
.stepper .btn { width: 46px; min-height: 46px; font-size: 22px; }
.stepper .btn svg { width: 20px; height: 20px; }
.stepper .val { font-size: 28px; }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.players li { min-height: 44px; padding: 4px 4px 4px 10px; gap: 8px; border-radius: 12px; }
.players .num { font-size: 13px; min-width: 1.4em; }
.players .pname { font-size: 17px; }
.chip { min-width: 36px; min-height: 36px; border-radius: 10px; }
.chip svg { width: 16px; height: 16px; }
.addrow { gap: 8px; }
.addrow input { flex-basis: 160px; min-height: 48px; padding: 6px 14px; font-size: 18px; border-radius: 14px; }
.addrow .btn { min-height: 48px; }
details.rules { padding-block: 8px; }
details.rules summary { min-height: 32px; font-size: 16px; }
details.rules ol { font-size: 15px; gap: 6px; }
.role { padding: 12px 14px; gap: 4px; }
.role.odd svg { width: 40px; height: 40px; }
.role.odd .big { font-size: 28px; }
.role.odd p, .role.same { font-size: 16px; }
.vote-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.vote { min-height: 66px; padding: 8px 6px; gap: 4px; font-size: 17px; border-radius: 14px; }
.vote .av { width: 28px; height: 28px; font-size: 14px; }
.hero { margin-top: -12px; padding-top: 14px; padding-bottom: 14px; gap: 4px; }
.hero svg { width: 30px; height: 30px; }
.hero h1, .hero h2 { font-size: 26px; }
.hero p { font-size: 16px; }
.hero p b { color: inherit; }
.qcards { grid-template-columns: 1fr 1fr; gap: 8px; }
.qcard { padding: 10px 12px; gap: 6px; border-radius: 14px; border-top-width: 4px; }
.qcard .label { font-size: 12px; gap: 6px; letter-spacing: .03em; }
.qcard .qi { width: 24px; height: 24px; border-radius: 7px; flex: none; }
.qcard .qi svg { width: 14px; height: 14px; }
.qcard .qtext { font-size: 16px; }
.qcard .who-list { font-size: 13px; }
.callout { padding: 14px; font-size: 17px; border-radius: 16px; }
.ask { font-size: 22px; text-align: center; }
.points { gap: 4px; }
.points p { font-size: 16px; }
.scores { gap: 6px; }
.scores li { padding: 6px 12px; gap: 3px 10px; border-radius: 12px; }
.scores .rank, .scores .gain { font-size: 14px; }
.scores .sname { font-size: 17px; }
.scores .pts { font-size: 22px; }
.bar { height: 5px; }
.page-title { font-size: 26px; text-align: center; }
/* Big groups: two-column scoreboard so 7-10 players still fit on one screen. */
.scores.many { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scores.many li { padding: 6px 8px; gap: 3px 6px; }
.scores.many .sname { font-size: 15px; }
.scores.many .gain { font-size: 12px; padding: 1px 5px; }
.scores.many .pts { font-size: 19px; min-width: 1.2em; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(function () {

/* ---------- State & storage ---------- */
var KEY = 'oddQuestion.v1';
var MIN_P = 3, MAX_P = 10;

function loadStore() {
  try { var v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v === 'object' ? v : {}; }
  catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

var stored = (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.S) || loadStore();
var S = {
  lang: stored.lang === 'fr' ? 'fr' : 'en',
  players: Array.isArray(stored.players) ? stored.players.filter(function (p) { return typeof p === 'string' && p.trim(); }).slice(0, MAX_P) : [],
  target: Number.isInteger(stored.target) && stored.target >= 3 && stored.target <= 50 ? stored.target : 10,
  deck: stored.deck && Array.isArray(stored.deck.order) ? stored.deck : null,
  game: stored.game && typeof stored.game === 'object' && stored.game.scores ? stored.game : null
};
// Never land on a visible question after a reload: go back to "pass the phone".
if (S.game && S.game.phase === 'show') S.game.phase = 'pass';

var ui = { menu: false, confirmEnd: false, error: '' };

if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(function () { return { S: S }; }); } catch (e) {}
}

/* ---------- Helpers ---------- */
function t(key, vars) {
  var s = T[S.lang][key];
  if (typeof s !== 'string') return s;
  return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && vars[k] != null ? vars[k] : ''; });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}
function nextPairId() {
  var d = S.deck;
  if (!d || d.order.length !== PAIRS.length || d.pos >= d.order.length) {
    var last = d && d.order ? d.order[d.order.length - 1] : -1;
    var order = shuffle(PAIRS.map(function (_, i) { return i; }));
    if (order[0] === last && order.length > 1) { order[0] = order[order.length - 1]; order[order.length - 1] = last; }
    d = S.deck = { order: order, pos: 0 };
  }
  return d.order[d.pos++];
}
function joinNames(list) {
  var e = list.map(esc);
  if (e.length < 2) return e.join('');
  return e.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + e[e.length - 1];
}

/* ---------- Game flow ---------- */
function startGame() {
  var scores = {};
  S.players.forEach(function (p) { scores[p] = 0; });
  S.game = { scores: scores, round: 0, players: S.players.slice() };
  newRound();
}
function newRound() {
  var g = S.game, ps = g.players, n = ps.length;
  g.round += 1;
  var shift = (g.round - 1) % n;
  g.order = ps.slice(shift).concat(ps.slice(0, shift));
  g.odd = ps[Math.floor(Math.random() * n)];
  g.pairId = nextPairId();
  g.passIdx = 0;
  g.accused = null;
  g.guessed = null;
  g.revealStep = null;
  g.gains = {};
  g.phase = 'pass';
  commit();
}
function award(name, pts) {
  S.game.scores[name] = (S.game.scores[name] || 0) + pts;
  S.game.gains[name] = (S.game.gains[name] || 0) + pts;
}
function reveal() {
  var g = S.game;
  g.phase = 'reveal';
  if (g.accused === g.odd) {
    g.players.forEach(function (p) { if (p !== g.odd) award(p, 1); });
    g.revealStep = 'guessing';
  } else {
    award(g.odd, 3);
    g.revealStep = 'done';
  }
  commit();
}
function answerGuess(yes) {
  var g = S.game;
  if (g.revealStep !== 'questions') return;
  g.guessed = yes;
  if (yes) award(g.odd, 2);
  g.revealStep = 'done';
  commit();
}
function toScores() {
  var g = S.game, max = 0;
  g.players.forEach(function (p) { max = Math.max(max, g.scores[p]); });
  g.phase = max >= S.target ? 'winner' : 'scores';
  commit();
}

function commit() { save(); render(); }

function nextOrWin() {
  var g = S.game, max = 0;
  g.players.forEach(function (p) { max = Math.max(max, g.scores[p]); });
  if (max >= S.target) { g.phase = 'winner'; commit(); }
  else newRound();
}

  var top = g.scores[ranked[0]];
  return '<ul class="scores' + (ranked.length > 6 ? ' many' : '') + '">' + ranked.map(function (p, i) {
    var gain = g.gains[p] || 0;
    var pct = Math.min(100, Math.round(g.scores[p] / S.target * 100));
    return '<li class="' + (top > 0 && g.scores[p] === top ? 'lead' : '') + '">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="sname">' + esc(p) + '</span>' +
      '<span class="gain' + (gain ? '' : ' none') + '">+' + gain + '</span>' +
      '<span class="pts" aria-label="' + g.scores[p] + ' ' + t('pt') + '">' + g.scores[p] + '</span>' +
      '<span class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></span>' +
    '</li>';
  }).join('') + '</ul>';
}

function viewScores(g) {
  return topbar(g) +
    '<h2 class="page-title">' + esc(t('scores')) + '</h2>' +
    '<p class="muted center">' + esc(t('firstTo', { n: S.target })) + '</p>' +
    scoreList(g) +
    '<div class="dock"><button class="btn btn-go" data-act="nextround">' + I.arrow + esc(t('nextRound')) + '</button></div>';
}

function viewWinner(g) {
  var max = 0;
  g.players.forEach(function (p) { max = Math.max(max, g.scores[p]); });
  var winners = g.players.filter(function (p) { return g.scores[p] === max; });
  var title = winners.length === 1 ? esc(t('wins', { name: winners[0] })) : t('tieWin', { names: joinNames(winners) });
  return '<div class="hero win">' + I.trophy + '<h1>' + title + '</h1></div>' +
    scoreList(g) +
    '<div class="dock"><div class="row">' +
      '<button class="btn btn-ghost" data-act="change">' + esc(t('changePlayers')) + '</button>' +
      '<button class="btn btn-go" data-act="again">' + I.arrow + esc(t('playAgain')) + '</button>' +
    '</div></div>';
}

function viewMenu() {
  if (ui.confirmEnd) {
    return '<h2>' + esc(t('endSure')) + '</h2>' +
      '<div class="dock">' +
        '<button class="btn btn-danger" data-act="endyes">' + esc(t('endYes')) + '</button>' +
        '<button class="btn btn-ghost" data-act="endno">' + esc(t('endNo')) + '</button>' +
      '</div>';
  }
  return '<div class="eyebrow">' + esc(t('menuTitle')) + '</div>' +
    '<p class="muted center">' + esc(t('firstTo', { n: S.target })) + '</p>' +
    scoreList(S.game) +
    '<div class="dock">' +
      '<button class="btn btn-go" data-act="closemenu">' + I.arrow + esc(t('backToGame')) + '</button>' +
      '<button class="btn btn-ghost" data-act="endgame">' + esc(t('newGame')) + '</button>' +
    '</div>';
}

/* ---------- Render ---------- */
var app = document.getElementById('app');
var lastKey = '';

function render() {
  document.documentElement.lang = S.lang;
  var g = S.game, html, key;
  if (!g || g.phase === 'setup') { html = viewSetup(); key = 'setup'; }
  else if (ui.menu) { html = viewMenu(); key = 'menu' + ui.confirmEnd; }
  else {
    key = g.phase + g.round + ':' + g.passIdx + ':' + g.revealStep;
    html = ({
      pass: viewPass, show: viewShow, answer: viewAnswer, vote: viewVote, confirm: viewConfirm,
      reveal: viewReveal, scores: viewScores, winner: viewWinner
    }[g.phase] || viewPass)(g);
  }
  var animate = key !== lastKey;
  lastKey = key;
  app.innerHTML = '<div class="screen">' + html + '</div>';
  if (!animate) app.firstChild.style.animation = 'none';
  if (animate) window.scrollTo(0, 0);
}

/* ---------- Events ---------- */
app.addEventListener('submit', function (e) {
  e.preventDefault();
  var input = document.getElementById('name-input');
  var name = (input.value || '').replace(/\s+/g, ' ').trim();
  if (!name) { input.focus(); return; }
  var exists = S.players.some(function (p) { return p.toLowerCase() === name.toLowerCase(); });
  if (exists) { ui.error = t('dup', { name: name }); }
  else if (S.players.length >= MAX_P) { ui.error = t('full'); }
  else { S.players.push(name); ui.error = ''; save(); }
  render();
  var again = document.getElementById('name-input');
  if (again) again.focus();
});

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var g = S.game, act = b.getAttribute('data-act');
  switch (act) {
    case 'lang': S.lang = b.getAttribute('data-v'); ui.error = ''; commit(); break;
    case 'remove': S.players.splice(+b.getAttribute('data-i'), 1); ui.error = ''; commit(); break;
    case 'target':
      S.target = Math.max(3, Math.min(50, S.target + +b.getAttribute('data-d'))); commit(); break;
    case 'start': if (S.players.length >= MIN_P) { ui.error = ''; keepAwake(); startGame(); } break;
    case 'continue': keepAwake(); commit(); break;
    case 'menu': ui.menu = true; ui.confirmEnd = false; render(); break;
    case 'closemenu': ui.menu = false; render(); break;
    case 'endgame': ui.confirmEnd = true; render(); break;
    case 'endno': ui.confirmEnd = false; ui.menu = false; render(); break;
    case 'endyes': ui.menu = false; ui.confirmEnd = false; S.game = null; commit(); break;
    case 'show': g.phase = 'show'; commit(); break;
    case 'hide':
      g.passIdx += 1;
      g.phase = g.passIdx >= g.order.length ? 'answer' : 'pass';
      commit(); break;
    case 'tovote': g.phase = 'vote'; commit(); break;
    case 'accuse': g.accused = g.players[+b.getAttribute('data-i')]; g.phase = 'confirm'; commit(); break;
    case 'revote': g.accused = null; g.phase = 'vote'; commit(); break;
    case 'reveal': if (g.phase === 'confirm') reveal(); break;
    case 'showqs': if (g.revealStep === 'guessing') { g.revealStep = 'questions'; commit(); } break;
    case 'guess': answerGuess(b.getAttribute('data-v') === '1'); break;
    case 'toscores': if (g.revealStep === 'done') toScores(); break;
    case 'nextround': if (g.phase === 'scores' || g.revealStep === 'done') nextOrWin(); break;
    case 'again': S.players = g.players.slice(); startGame(); break;
    case 'change': S.game = null; commit(); break;
  }
});

/* Keep the screen on while playing, if the device allows it. */
var wakeLock = null;
function keepAwake() {
  try {
    if (navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l; l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.game) keepAwake();
});

render();
})();
</script>
</body>
</html>
